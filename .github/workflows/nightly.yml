name: Nightly

# The slow tier: what is too long or too noisy for every PR. Each suite runs
# on its own runner with its own timeout and uploads its own report, so a slow
# or failing suite can't starve the others. A job that times out skips even
# its always() steps, so with one job one slow suite lost every report.
# Specs tagged @gpu are skipped: the runner has no GPU, renders WebGL in
# software at a few frames a second, and they wait on per-frame work. The perf
# budget is left out for the same reason (its budgets were measured on an M1
# Pro); `npm run test:nightly` still runs both locally.
on:
  schedule:
    - cron: "17 4 * * *" # 04:17 UTC, off the top of the hour
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # Pinned to the Ubuntu release this Playwright has browser builds for, as
  # the e2e job in ci.yml is (see the note there).
  suite:
    name: nightly (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: gate
            run: npx playwright test --project=chromium tests/playtest-gate.spec.js --output=test-results/gate
          - suite: bots
            run: npx playwright test --project=chromium tests/bots.spec.js --grep-invert @gpu --output=test-results/bots
          - suite: specs
            run: >
              npx playwright test --project=chromium
              tests/forge.spec.js tests/cinematic.spec.js tests/aria.spec.js
              tests/weapon-fire.spec.js tests/mobile-layout.spec.js tests/suits.spec.js
              --grep-invert @gpu --output=test-results/specs
          - suite: visual
            run: npm run test:visual -- --output=test-results/visual
          # One worker: the sweep plays levels in order.
          - suite: sweep
            run: npm run test:sweep -- --output=test-results/sweep
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Keyed on the OS release, architecture and Playwright version, as in
      # ci.yml: browsers restored onto a different release may not load.
      - name: Playwright cache key
        id: pw-key
        run: |
          . /etc/os-release
          echo "key=playwright-chromium-webkit-${ID}${VERSION_ID}-$(uname -m)-$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.pw-key.outputs.key }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit --with-deps

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: Run ${{ matrix.suite }}
        run: ${{ matrix.run }}

      - name: Upload report, traces and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ matrix.suite }}
          path: |
            playwright-report/
            test-results/
            screenshots/
          if-no-files-found: ignore
          retention-days: 14

  # One check to read: red if any suite failed, timed out or was cancelled.
  result:
    needs: suite
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "suites: ${{ needs.suite.result }}"
          [ "${{ needs.suite.result }}" = "success" ]
