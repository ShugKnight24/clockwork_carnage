name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ── Stage 1: Syntax check (fast gate) ──────────────────────────
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Syntax check all JS files
        run: |
          echo "Checking JavaScript syntax..."
          errors=0
          for f in $(find js/ src/ -name '*.js' -not -path 'node_modules/*'); do
            if ! node -c "$f" 2>/dev/null; then
              echo "FAIL: $f"
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "FAIL: $errors file(s) have syntax errors"
            exit 1
          fi
          echo "All JS files pass syntax check"

      - name: Validate HTML
        run: |
          for f in index.html; do
            if [ ! -s "$f" ]; then
              echo "FAIL: $f is missing or empty"
              exit 1
            fi
          done
          echo "HTML check passed"

  # ── Stage 2: Unit tests (vitest) ───────────────────────────────
  unit-tests:
    runs-on: ubuntu-latest
    needs: syntax-check
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx vitest run --reporter=verbose

  # ── Stage 3: Build (vite) ──────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: syntax-check
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3

  # ── Stage 4: Playwright smoke test ─────────────────────────────
  smoke-test:
    runs-on: ubuntu-latest
    needs: [unit-tests, build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run smoke tests
        run: npx playwright test tests/smoke.spec.js

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
