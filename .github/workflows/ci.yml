name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A newer push to the same branch or PR replaces the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One checkout and one install. GitHub Pages serves master as it is, so a
  # red run here is the signal not to merge. The slow tier (bots, the
  # campaign sweep, forge, cinematics, perf, visuals) runs in nightly.yml.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The cheap static checks first: each fails in seconds.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx vitest run

      - name: Validate maps
        run: npm run validate:maps

      - name: Build
        run: npm run build

      - name: Size budget
        run: npm run check:size

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-webkit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit --with-deps

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      # Smoke, cold-start, the core loop and settings specs on Chromium, the
      # bots' data/maps/balance/states/saveload groups, and smoke + cold-start
      # again on WebKit as an iPhone 15 Pro held sideways (npm run test:pr).
      # Four workers, one per runner core, keep it inside ten minutes.
      - name: PR tier (dev server)
        run: npm run test:pr -- --workers=4

      - name: Pages (the live site as players load it)
        run: npm run test:pages

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
