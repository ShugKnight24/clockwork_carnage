<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="geometricPrecision">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%">
      <stop offset="0" stop-color="#aaffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aaffff"/>
      <stop offset="1" stop-color="#114444"/>
    </linearGradient>
    <filter id="eyeGlow"><feGaussianBlur stdDeviation="1"/></filter>
  </defs>
  <rect width="64" height="64" fill="url(#bg)"/>
      <ellipse cx="32" cy="34" rx="14" ry="12" fill="url(#body)"/>
      <rect x="14" y="20" width="36" height="2" fill="#114444"/>
      <circle cx="32" cy="34" r="4" fill="#fff" filter="url(#eyeGlow)"/>
      <circle cx="32" cy="34" r="2" fill="#aaffff"/>
    
</svg>
